<!doctype html>
<html lang="en" translate="no" class="{{htmlClasses}}">
  <head>
    <!-- {{basePath}} -->
    <meta charset="UTF-8" />
    <link rel="icon" href="{{faviconUrl}}" id="favicon"/>
    <link rel="manifest" href="./manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#191A1C" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="{{panelName}}" />
    <title>{{panelName}}</title>
    <meta name="description" content="{{ogDescripttion}}">
    <meta name="author" content="chyarogroup">
    <!-- Open Graph Meta Tags -->
    <meta property="og:url" content="https://github.com/chyarofivem/cAdminPanel">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ogTitle}}">
    <meta property="og:description" content="{{ogDescripttion}}">
    <meta property="og:image" content="{{ogImage}}">
    <meta name="robots" content="noindex, nofollow">
    <!-- {{txConstsInjection}} -->
    <!-- {{devModules}} -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx" data-prod-only></script>
    <script data-always-remove>
      if (!window?.txConsts) { document.body.innerHTML = '<p style="margin: 1rem;">Panel configuration was not injected.<br />Open this page through the running server panel.</p>'; }
    </script>
    <!-- {{customThemesStyle}} -->
  </body>
</html>
